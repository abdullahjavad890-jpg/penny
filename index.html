<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Penny">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Penny keeps track of where your money goes.">
<title>Penny</title>
<script>
  // Pick the saved light/dark look before anything paints, so there is no flash.
  try { var t = localStorage.getItem('penny:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  html, body { background: #F5F0E6; }
  @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #111315; } }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #111315; }
</style>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="font-fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="font-instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
</div>

<nav id="nav" aria-label="Main">
  <button data-act="tab" data-tab="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>
    <span>Home</span>
  </button>
  <button data-act="tab" data-tab="budget">
    <svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.9A8.5 8.5 0 0 1 20.1 9H15z"/></svg>
    <span>Budget</span>
  </button>
  <button class="fab" data-act="add" aria-label="Add a transaction">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-act="tab" data-tab="activity">
    <svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="3"/></svg>
    <span>Activity</span>
  </button>
  <button data-act="tab" data-tab="more">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    <span>More</span>
  </button>
</nav>

<div id="onboard"></div>
<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
